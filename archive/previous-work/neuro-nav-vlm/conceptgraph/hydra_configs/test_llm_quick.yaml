defaults:
  - base
  - base_mapping
  - replica
  - sam
  - classes
  - logging_level
  - _self_

# Quick test config for LLM functionality
# Only processes 3 frames to test if OpenAI API works

dataset_config: ${repo_root}/conceptgraph/dataset/dataconfigs/replica/replica_mini_test.yaml
scene_id: room0
start: 0
end: 9  # Process frames 0, 3, 6 (3 frames total)
stride: 3  # Match existing detections stride

# Reuse existing detections
detections_exp_suffix: s_detections_simple_test
force_detection: false
save_detections: false

# ⭐ ENABLE LLM ⭐
make_edges: true

exp_suffix: r_llm_quick_test

# Minimal visualization to save memory
save_video: false
save_objects_all_frames: false
debug_render: false
vis_render: false
use_rerun: false  # Disable to avoid rerun warnings
save_rerun: false

sam_variant: mobile_sam

# Lightweight processing
downsample_voxel_size: 0.025
obj_pcd_max_points: 2000
use_iou: false
spatial_sim_type: giou
phys_bias: 0.0
sim_threshold: 1.2

# Skip heavy processing
denoise_interval: -1
filter_interval: -1
merge_interval: -1
run_denoise_final_frame: false
run_filter_final_frame: false
run_merge_final_frame: false

dbscan_remove_noise: true
dbscan_eps: 0.1
dbscan_min_points: 10

obj_min_points: 0
obj_min_detections: 1

# Outputs
save_pcd: false
save_json: true

use_semantic_labels: true

# Run on CPU to avoid CUDA issues
device: cpu



