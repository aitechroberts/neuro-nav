# VLM-based pipeline configuration
# Uses Florence-2 for captioning and Qwen2-VL for refinement
# Replaces YOLO+CLIP+LLaVA+GPT-4

defaults:
  - base
  - base_mapping
  - replica
  - sam
  - classes
  - logging_level
  - _self_

# Dataset configuration
dataset_config: ${repo_root}/conceptgraph/dataset/dataconfigs/replica/replica_simple_test.yaml
scene_id: room0
stride: 3

# Detection settings
detections_exp_suffix: s_detections_vlm_test
force_detection: true
save_detections: true
make_edges: false

# Experiment naming
exp_suffix: r_mapping_vlm_test

# Visualization settings
save_video: false
save_objects_all_frames: false
debug_render: false
vis_render: false
use_rerun: true
save_rerun: false

# SAM settings
sam_variant: mobile_sam

# Point cloud settings
downsample_voxel_size: 0.025
obj_pcd_max_points: 2000

# Object matching settings
use_iou: false
spatial_sim_type: giou
phys_bias: 0.0
sim_threshold: 1.2

# Processing intervals (disabled for testing)
denoise_interval: -1
filter_interval: -1
merge_interval: -1
merge_overlap_thresh: -1
run_denoise_final_frame: false
run_filter_final_frame: false
run_merge_final_frame: false

# DBSCAN settings
dbscan_remove_noise: true
dbscan_eps: 0.1
dbscan_min_points: 10

# Object filtering
obj_min_points: 0
obj_min_detections: 1

# Output settings
save_pcd: false
save_json: true

# VLM-specific settings
use_vlm: true
florence_model: "microsoft/Florence-2-large"  # or Florence-2-base for faster inference
qwen_model: "Qwen/Qwen2-VL-2B-Instruct"  # or Qwen2-VL-7B-Instruct for better quality

