defaults:
  - base
  - base_mapping
  - replica
  - sam
  - classes
  - logging_level
  - _self_

# LLM Test with ACTUAL GPT-4V calls
# This will run detections WITH GPT-4V analysis

dataset_config: ${repo_root}/conceptgraph/dataset/dataconfigs/replica/replica_mini_test.yaml
scene_id: room0
start: 0
end: 9  # 3 frames (0, 3, 6)
stride: 3

# ⭐ RUN NEW DETECTIONS with GPT-4V ⭐
detections_exp_suffix: s_detections_with_gpt4v
force_detection: true  # MUST be true to call GPT-4V
save_detections: true

# ⭐ ENABLE LLM ⭐
make_edges: true  # This enables GPT-4V for relationships and captions

exp_suffix: r_mapping_with_gpt4v

# Visualization
save_video: false
save_objects_all_frames: false
debug_render: false
vis_render: false
use_rerun: false
save_rerun: false

# Use MobileSAM
sam_variant: mobile_sam

# Lightweight processing
downsample_voxel_size: 0.025
obj_pcd_max_points: 2000
use_iou: false
spatial_sim_type: giou
phys_bias: 0.0
sim_threshold: 1.2

# Skip heavy post-processing
denoise_interval: -1
filter_interval: -1
merge_interval: -1
run_denoise_final_frame: false
run_filter_final_frame: false
run_merge_final_frame: false

dbscan_remove_noise: true
dbscan_eps: 0.1
dbscan_min_points: 10

obj_min_points: 0
obj_min_detections: 1

# Outputs
save_pcd: false
save_json: true

use_semantic_labels: true

# CPU to avoid CUDA issues
device: cpu

