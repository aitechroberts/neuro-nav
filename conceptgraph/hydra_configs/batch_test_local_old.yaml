defaults:
  - base
  - base_mapping
  - replica
  - sam
  - classes
  - logging_level
  - _self_

# Keep naming consistent with batch pipelines but differentiate local runs
detections_exp_suffix: s_detections_batch
force_detection: !!bool True
save_detections: !!bool True

# Local smoke tests disable VLM edges by default (override with MAKE_EDGES=true)
make_edges: !!bool False

# Short frame range for quick iteration (override via env START/END/STRIDE)
start: 0
end: 10
stride: 1
exp_suffix: batch_vlm_local

# Optional override so outputs can be redirected to a dedicated mount
output_root: ${oc.env:OUTPUT_ROOT,}

# Batch-friendly toggles
save_video: !!bool False
save_objects_all_frames: !!bool False
save_semantic_snapshot: !!bool True

downsample_voxel_size: 0.01
obj_pcd_max_points: 5000

debug_render: !!bool False
vis_render: !!bool False

denoise_interval: 5
filter_interval: 5
merge_interval: 5
run_denoise_final_frame: !!bool True
run_filter_final_frame: !!bool True
run_merge_final_frame: !!bool True

dbscan_remove_noise: !!bool True
dbscan_eps: 0.1
dbscan_min_points: 10

obj_min_points: 0
obj_min_detections: 1

use_rerun: !!bool False
save_rerun: !!bool False

