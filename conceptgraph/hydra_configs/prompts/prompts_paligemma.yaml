# prompts_paligemma.yaml
# Optimized for PaliGemma 2 (Task-based VLM)

# 1. CAPTIONING
# PaliGemma expects a simple prefix. We use "caption en" to trigger
# its English captioning head. The code appends the labels.
caption: "caption en"

# The template that injects the label list.
# We keep it extremely brief so the model focuses on the image, not reading instructions.
captions_with_labels: >
  Describe the object with id {labels}.

# 2. RELATIONS
# We use the "answer en" prefix to treat this as a Visual Question Answering (VQA) task.
relation: "answer en"

# We ask a direct question about the specific objects listed.
relations_with_labels: >
  What is the spatial relationship between {labels}?

# 3. CONSOLIDATION (Warning: PaliGemma is not a text summarizer)
# Since the code forces a VLM call for this, we use a generic "answer" prefix.
# Note: Ideally, you should use a small text LLM (like Llama-3-8B) for this step, 
# as VLMs perform poorly on text-only tasks.
consolidate: "answer en"

# We frame the consolidation as a question to the model.
consolidate_prompt: >
  Summarize these descriptions into one short sentence: {captions}