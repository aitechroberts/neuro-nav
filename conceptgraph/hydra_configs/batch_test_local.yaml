defaults:
  - base            # toggles wandb / rerun basics
  - base_mapping    # mapping + slam defaults
  - replica         # Replica dataset paths/config
  - sam             # SAM model config
  - classes         # object classes + bg classes
  - logging_level
  - _self_

# Use the Docker/env defaults but allow overrides via env + CLI

# Where merged outputs go. batch_test_local.py will look at this via
# _resolve_output_base() and build: output_root/scene_id/exps/exp_suffix
output_root: ${env:OUTPUT_ROOT, null}

# Detection experiment label
detections_exp_suffix: ${env:DET_EXP_SUFFIX, s_detections_batch}
force_detection: !!bool True
save_detections: !!bool False

# For local laptop runs, usually no VLM edges and no heavy viz.
make_edges: ${env:MAKE_EDGES, true}
save_json: ${env:SAVE_JSON, true}
save_pcd: ${env:SAVE_PCD, true}
save_semantic_snapshot: ${env:SAVE_SEMANTIC_SNAPSHOT, true}
vis_render: ${env:VIS_RENDER, false}

# Device / frame selection (overridable by env + CLI)
device: ${env:DEVICE, cuda}
start: ${env:START, 0}
end: ${env:END, -1}
stride: ${env:STRIDE, 10}

# WandB off by default for laptop batch runs
use_wandb: ${env:USE_WANDB, true}
