defaults:
  - base
  - base_mapping
  - replica # Use replica dataset for testing
  - sam
  - classes
  - logging_level
  - _self_
  

# hydra:
#   verbose : true

# detections_exp_suffix: exp_s_detections_stride50_yes_bg_44_mr
detections_exp_suffix: s_detections_test_simple
force_detection: !!bool True  # Run detections on the fly
save_detections: !!bool True  # Save detections for debugging

# obj_min_detections: 1

start: 0  # Start from beginning
end: 50  # Process only first 50 frames for quick test
stride: 5  # Process every 5th frame (faster updates)
exp_suffix: r_mapping_test_simple
save_video: !!bool False  # Disable to make it faster
save_objects_all_frames: !!bool False  # Disable to make it faster
# merge_interval: 5
# log_level: INFO
downsample_voxel_size: 0.01
obj_pcd_max_points: 5000

debug_render: !!bool False

denoise_interval: -1           # Run DBSCAN every k frame. This operation is heavy
filter_interval: -1           # Disable filtering to avoid issues
merge_interval: -1            # Disable merging (requires PyTorch3D)
run_denoise_final_frame: !!bool False  # Disable to avoid PyTorch3D
run_filter_final_frame: !!bool False   # Disable for simplicity
run_merge_final_frame: !!bool False    # Disable to avoid PyTorch3D

dbscan_remove_noise: !!bool True
dbscan_eps: 0.1
dbscan_min_points: 10

# Selection criteria of the fused object point cloud
obj_min_points: 0
obj_min_detections: 1

# For merge_overlap_objects() function
# merge_overlap_thresh: 0.7      # -1 means do not perform the merge_overlap_objects()
# merge_visual_sim_thresh: 0.7   # Merge only if the visual similarity is larger
# merge_text_sim_thresh: 0.7     # Merge only if the text cosine sim is larger

hydra:
  verbose: true
