automations:
  - name: Notify on gpu-pipeline failure
    description: Send a notification when the gpu-pipeline flow fails
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - prefect.flow-run.Failed
      # Limit to this flow by matching related resource
      match_related:
        any:
          - prefect.resource.role: "flow"
            prefect.resource.name: "gpu-pipeline"   # flow name from @flow decorator
    actions:
      - type: send-notification
        block_document_name: "my-email-block"   # create this Notification block in UI
        subject: "Flow Failed: {{ flow_run.name }}"
        body: |
          Flow {{ flow.name }} / deployment {{ deployment.name }} failed.
          State: {{ flow_run.state.name }}
          Message: {{ flow_run.state.message }}
          URL: {{ flow_run|ui_url }}

  - name: Cancel long-running gpu-pipeline runs
    description: Auto-cancel if Running > 30 minutes
    enabled: true
    trigger:
      type: event
      posture: Proactive
      expect:
        - prefect.flow-run.Completed
      threshold: 1
      within: 7200   # 2 hours
      for_each:
        - prefect.resource.id
      match_related:
        any:
          - prefect.resource.role: "flow"
            prefect.resource.name: "gpu-pipeline"
    actions:
      - type: cancel-flow-run
