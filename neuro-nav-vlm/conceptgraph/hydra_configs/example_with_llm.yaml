defaults:
  - base
  - base_mapping
  - replica
  - sam
  - classes
  - logging_level
  - _self_

# Example Configuration: Using LLM for Scene Understanding
# This demonstrates how to enable GPT-4V for spatial relationships and captions

# Dataset settings
dataset_config: ${repo_root}/conceptgraph/dataset/dataconfigs/replica/replica_mini_test.yaml
scene_id: room0
stride: 3

# Detection settings
detections_exp_suffix: s_detections_with_llm
force_detection: false  # Reuse existing detections
save_detections: true

# ⭐ ENABLE LLM FEATURES ⭐
make_edges: true  # This enables GPT-4V for relationships and captions

# Experiment naming
exp_suffix: r_mapping_with_llm

# Visualization settings
save_video: false
save_objects_all_frames: false
debug_render: false
vis_render: false
use_rerun: true  # Enable to see 3D visualization
save_rerun: true

# Model settings
sam_variant: mobile_sam

# Processing parameters
downsample_voxel_size: 0.025
obj_pcd_max_points: 2000
use_iou: false
spatial_sim_type: giou
phys_bias: 0.0
sim_threshold: 1.2

# Post-processing (can leave disabled for speed)
denoise_interval: -1
filter_interval: -1
merge_interval: -1
run_denoise_final_frame: false
run_filter_final_frame: false
run_merge_final_frame: false

# DBSCAN settings
dbscan_remove_noise: true
dbscan_eps: 0.1
dbscan_min_points: 10

# Object filtering
obj_min_points: 0
obj_min_detections: 1

# Output settings
save_pcd: true
save_json: true

# Semantic labels
use_semantic_labels: true



