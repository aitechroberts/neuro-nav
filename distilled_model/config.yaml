# Configuration for knowledge distillation training

# Data settings
data:
  data_root: "data"  # Root directory for neuro-nav data
  scene_ids: null  # List of scene IDs to use (null = auto-discover)
  max_samples: null  # Maximum number of samples (null = use all)
  task: "caption_refinement"  # Task type: caption_refinement, relationships, querying

# Teacher model settings
teacher:
  type: "qwen2vl"  # qwen2vl or florence2
  model_name: null  # HuggingFace model name (null = use default)
  device: "cuda:0"

# Student model settings
student:
  type: "tiny"  # tiny or phi2
  vocab_size: 32000
  hidden_size: 2048
  num_layers: 22
  num_attention_heads: 32
  vision_embed_dim: 768

# Training settings
training:
  num_epochs: 10
  batch_size: 4
  learning_rate: 1e-4
  weight_decay: 0.01
  save_freq: 5  # Save checkpoint every N epochs
  
# Distillation settings
distillation:
  temperature: 4.0  # Temperature for softmax
  alpha: 0.7  # Weight for distillation loss (1-alpha for hard labels)

# Output settings
output:
  output_dir: "distilled_model/outputs"
  save_best: true
  save_history: true

